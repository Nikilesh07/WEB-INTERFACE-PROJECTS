<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Card</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: #e8f5e9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box{
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px gray;
        }

        h2{
            text-align: center;
            color: #2e7d32;
        }

        input{
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #999;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button{
            width: 100%;
            padding: 10px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover{
            background: #1b5e20;
        }

        #card{
            display: none;
            margin-top: 20px;
            background: #f1f8e9;
            border-left: 6px solid #2e7d32;
            padding: 15px;
            border-radius: 5px;
        }

        p{
            margin: 10px 0;
        }
    </style>

</head>

<body>

<div class="box">

    <h2>Student Profile</h2>

    <input type="text" id="name" placeholder="Enter Name">

    <input type="text" id="roll" placeholder="Enter Roll Number">

    <input type="number" id="marks" placeholder="Enter Marks">

    <button onclick="showProfile()">Show Profile</button>

    <div id="card">

        <h3>Profile Details</h3>

        <p><b>Name :</b> <span id="sname"></span></p>

        <p><b>Roll No :</b> <span id="sroll"></span></p>

        <p><b>Marks :</b> <span id="smarks"></span></p>

        <p><b>Grade :</b> <span id="grade"></span></p>

    </div>

</div>

<script>

function showProfile(){

    let name = document.getElementById("name").value;
    let roll = document.getElementById("roll").value;
    let marks = document.getElementById("marks").value;

    if(name=="" || roll=="" || marks==""){
        alert("Please fill all fields");
        return;
    }

    let grade;

    if(marks>=90)
        grade="A+";
    else if(marks>=80)
        grade="A";
    else if(marks>=70)
        grade="B";
    else if(marks>=60)
        grade="C";
    else if(marks>=50)
        grade="D";
    else
        grade="F";

    document.getElementById("sname").innerHTML = name;
    document.getElementById("sroll").innerHTML = roll;
    document.getElementById("smarks").innerHTML = marks;
    document.getElementById("grade").innerHTML = grade;

    document.getElementById("card").style.display = "block";
}

</script>

</body>
</html>
